[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dissco-geographic-locality-mas"
version = "0.1.0"
description = "Geographic locality enrichment prototype for DiSSCo specimens"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]
# value service: make serve (FastAPI app in src/geographic_locality_mas/service.py)
service = ["fastapi>=0.110", "uvicorn>=0.29"]
# scripts/find_gazetteer_ready_specimens.py (Sandbox survey + gazetteer test)
explore = ["requests>=2.31", "pandas>=2.0"]

[project.scripts]
locality-mas = "geographic_locality_mas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
